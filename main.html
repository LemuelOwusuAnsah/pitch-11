<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Soccer Duel · enhanced 2D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1a4d2e 0%, #2e6b42 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 16px;
        }
        .game-wrapper {
            background: #1e3b2a;
            padding: 22px 22px 28px;
            border-radius: 52px 52px 36px 36px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7), inset 0 2px 4px rgba(255, 255, 255, 0.2);
            border-bottom: 6px solid #0f2b1b;
        }
        canvas {
            display: block;
            margin: 0 auto;
            width: 800px;
            height: 500px;
            border-radius: 26px;
            box-shadow: inset 0 0 0 2px #c9b27c, inset 0 0 0 6px #6b4e2e, 0 12px 22px rgba(0, 0, 0, 0.6);
            background-color: #3a7d44;
            cursor: none;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 14px 12px 0;
            color: #f5e9d8;
            font-weight: 700;
            text-shadow: 2px 2px 0 #0f2b1b, 4px 4px 0 rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.9rem;
            background: rgba(0, 0, 0, 0.35);
            padding: 6px 24px;
            border-radius: 50px;
            backdrop-filter: blur(2px);
            border: 2px solid #ebd09c;
        }
        .team span {
            font-size: 2rem;
            min-width: 48px;
            text-align: center;
        }
        .divider {
            font-size: 2.4rem;
            opacity: 0.9;
            background: #2d2216;
            padding: 0 20px;
            border-radius: 60px;
            border: 2px solid #bba66b;
            line-height: 1.4;
        }
        .instructions {
            display: flex;
            justify-content: center;
            gap: 44px;
            color: #d9cfb0;
            font-weight: 500;
            font-size: 1.1rem;
            margin-top: 14px;
            text-shadow: 1px 1px 0 #0f2b1b;
            background: #1f3d2b;
            padding: 8px 24px;
            border-radius: 40px;
            border: 1px solid #7e9f7a;
        }
        .instructions kbd {
            background: #2e2b20;
            color: #ffeab3;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: bold;
            border: 1px solid #dbb86a;
            margin: 0 3px;
            font-size: 1rem;
        }
        .reset-btn {
            background: #a57c4b;
            border: none;
            color: #fef7e6;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 8px 22px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 0 #4f351b, 0 6px 12px black;
            transition: all 0.08s;
            border: 1px solid #e9c88b;
            letter-spacing: 1px;
            margin-left: 20px;
        }
        .reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4f351b, 0 6px 12px black;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="scoreboard">
        <div class="team">⚽ YOU <span id="playerScore">0</span></div>
        <div class="divider">VS</div>
        <div class="team">CPU <span id="cpuScore">0</span> ⚽</div>
        <button class="reset-btn" id="resetMatchBtn">⟲ NEW MATCH</button>
    </div>
    <div class="instructions">
        <div><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move</div>
        <div><kbd>␣ Space</kbd> kick (towards mouse)</div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const playerScoreSpan = document.getElementById('playerScore');
        const cpuScoreSpan = document.getElementById('cpuScore');

        // ---------- FIXED DIMENSIONS ----------
        const W = 800, H = 500;

        // ---------- GAME STATE ----------
        let playerScore = 0;
        let cpuScore = 0;
        let goalCooldown = 0;          // frames to wait after goal (avoids instant re-trigger)
        const GOAL_COOLDOWN_FRAMES = 30;

        // Mouse position (for aiming kicks)
        let mouseX = W / 2;
        let mouseY = H / 2;

        // ---------- BALL ----------
        const ball = {
            x: W / 2,
            y: H / 2,
            vx: 0,
            vy: 0,
            radius: 12,
            friction: 0.986,
            maxSpeed: 11,
            color: '#f5f5f5',
        };

        // ---------- PLAYER (controlled) ----------
        const player = {
            x: 200,
            y: H / 2,
            radius: 20,
            speed: 4.9,
            color: '#2d7be0',
            border: '#a0d0ff',
            kickPower: 7.5
        };

        // ---------- CPU (opponent) ----------
        const cpu = {
            x: 600,
            y: H / 2,
            radius: 20,
            speed: 3.35,
            color: '#d64545',
            border: '#ffb0b0'
        };

        // ---------- GOALS ----------
        const goalWidth = 130;
        const goalTop = (H - goalWidth) / 2;
        const goalBottom = goalTop + goalWidth;

        const leftGoalLineX = 22;
        const rightGoalLineX = W - 22;

        // ---------- INPUT ----------
        const keys = {
            w: false, a: false, s: false, d: false,
            space: false
        };

        // ---------- RESET POSITIONS (after goal) ----------
        function resetPositions(scoredBy) {
            ball.x = W / 2;
            ball.y = H / 2;
            ball.vx = 0;
            ball.vy = 0;

            player.x = 200;
            player.y = H / 2;

            cpu.x = 600;
            cpu.y = H / 2;

            // give a little grace period after reset
            goalCooldown = GOAL_COOLDOWN_FRAMES;
        }

        // ---------- SCORE & RESET ----------
        function scoreForPlayer() {
            if (goalCooldown > 0) return;
            playerScore++;
            playerScoreSpan.textContent = playerScore;
            resetPositions('player');
        }

        function scoreForCpu() {
            if (goalCooldown > 0) return;
            cpuScore++;
            cpuScoreSpan.textContent = cpuScore;
            resetPositions('cpu');
        }

        // ---------- COLLISION: BALL WITH PLAYER/CPU ----------
        function handleBallCollision(entity, isPlayer = true) {
            const dx = ball.x - entity.x;
            const dy = ball.y - entity.y;
            const dist = Math.hypot(dx, dy);
            const minDist = ball.radius + entity.radius;

            if (dist < minDist && dist > 0.001) {
                // push ball out
                const angle = Math.atan2(dy, dx);
                const overlap = minDist - dist;
                ball.x += Math.cos(angle) * overlap * 1.08;
                ball.y += Math.sin(angle) * overlap * 1.08;

                // reflect velocity with energy
                const speed = Math.hypot(ball.vx, ball.vy);
                if (speed < 0.6 && isPlayer) {
                    // soft nudge if ball almost still
                    const nudgeAngle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.6;
                    const nudgeSpeed = 2.2 + Math.random() * 2.5;
                    ball.vx += Math.cos(nudgeAngle) * nudgeSpeed;
                    ball.vy += Math.sin(nudgeAngle) * nudgeSpeed;
                } else {
                    // reflect only if moving towards entity
                    const dot = ball.vx * Math.cos(angle) + ball.vy * Math.sin(angle);
                    if (dot < 0) {
                        ball.vx -= 1.7 * dot * Math.cos(angle);
                        ball.vy -= 1.7 * dot * Math.sin(angle);
                    }
                }

                // player movement influence
                if (isPlayer) {
                    if (keys.w) ball.vy -= 0.5;
                    if (keys.s) ball.vy += 0.5;
                    if (keys.a) ball.vx -= 0.5;
                    if (keys.d) ball.vx += 0.5;
                }

                // limit ball speed after collision
                const newSpeed = Math.hypot(ball.vx, ball.vy);
                if (newSpeed > ball.maxSpeed) {
                    ball.vx = (ball.vx / newSpeed) * ball.maxSpeed;
                    ball.vy = (ball.vy / newSpeed) * ball.maxSpeed;
                }
            }
        }

        // ---------- KICK (player action) ----------
        function playerKick() {
            if (!keys.space || goalCooldown > 0) return;

            const dx = mouseX - player.x;
            const dy = mouseY - player.y;
            const length = Math.hypot(dx, dy);
            if (length < 0.1) return;

            const dirX = dx / length;
            const dirY = dy / length;

            const ballDist = Math.hypot(ball.x - player.x, ball.y - player.y);
            if (ballDist < 80) {
                const distToMouse = Math.min(260, Math.hypot(mouseX - player.x, mouseY - player.y));
                const power = 5.5 + (distToMouse / 260) * 6.5; // 5.5..12

                ball.vx += dirX * power;
                ball.vy += dirY * power;

                const sp = Math.hypot(ball.vx, ball.vy);
                if (sp > 15) {
                    ball.vx = (ball.vx / sp) * 15;
                    ball.vy = (ball.vy / sp) * 15;
                }
            }
        }

        // ---------- RESET MATCH ----------
        function resetMatch() {
            playerScore = 0;
            cpuScore = 0;
            playerScoreSpan.textContent = '0';
            cpuScoreSpan.textContent = '0';
            resetPositions('manual');
        }

        // ---------- UPDATE GAME ----------
        function update() {
            // decrease goal cooldown
            if (goalCooldown > 0) goalCooldown--;

            // ----- 1. PLAYER MOVEMENT (WASD) -----
            let moveX = 0, moveY = 0;
            if (keys.w) moveY -= 1;
            if (keys.s) moveY += 1;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;

            if (moveX !== 0 || moveY !== 0) {
                const len = Math.hypot(moveX, moveY);
                moveX = (moveX / len) * player.speed;
                moveY = (moveY / len) * player.speed;
            }

            player.x = Math.min(W - player.radius - 8, Math.max(player.radius + 8, player.x + moveX));
            player.y = Math.min(H - player.radius - 8, Math.max(player.radius + 8, player.y + moveY));

            // ----- 2. CPU AI (smarter chasing + defensive positioning) -----
            const ballToGoalX = (ball.x < W/2) ? ball.x : W - ball.x; // distance to nearest goal
            const cpuDefensiveBias = 0.65; // how much CPU stays between ball and its own goal

            // target: mix between ball and a defensive spot
            const targetX = ball.x + (ball.x < cpu.x ? -20 : 20);
            const targetY = ball.y + (ball.y > H/2 ? -15 : 15);

            let dxCpu = targetX - cpu.x;
            let dyCpu = targetY - cpu.y;
            const distToTarget = Math.hypot(dxCpu, dyCpu);

            if (distToTarget > 12) {
                const angle = Math.atan2(dyCpu, dxCpu);
                // add slight randomness and reaction delay
                const randomOffset = (Math.random() - 0.5) * 0.35;
                const moveAngle = angle + randomOffset;
                const step = cpu.speed * (0.92 + Math.random() * 0.18);
                cpu.x += Math.cos(moveAngle) * step;
                cpu.y += Math.sin(moveAngle) * step;
            } else {
                // small wiggle to avoid perfect stillness
                cpu.x += (Math.random() - 0.5) * 1.4;
                cpu.y += (Math.random() - 0.5) * 1.4;
            }

            // keep CPU within field, but avoid own goal area (stay out of goal mouth)
            cpu.x = Math.min(W - cpu.radius - 18, Math.max(cpu.radius + 18, cpu.x));
            cpu.y = Math.min(H - cpu.radius - 16, Math.max(cpu.radius + 16, cpu.y));

            // ----- 3. BALL PHYSICS -----
            ball.x += ball.vx;
            ball.y += ball.vy;

            // friction
            ball.vx *= ball.friction;
            ball.vy *= ball.friction;

            // stop tiny movement
            if (Math.abs(ball.vx) < 0.045) ball.vx = 0;
            if (Math.abs(ball.vy) < 0.045) ball.vy = 0;

            // limit max ball speed
            const ballSpeed = Math.hypot(ball.vx, ball.vy);
            if (ballSpeed > 15) {
                ball.vx = (ball.vx / ballSpeed) * 15;
                ball.vy = (ball.vy / ballSpeed) * 15;
            }

            // ----- 4. WALL BOUNCE (top / bottom) -----
            if (ball.x - ball.radius < 8) {
                ball.x = 8 + ball.radius;
                ball.vx *= -0.72;
            } else if (ball.x + ball.radius > W - 8) {
                ball.x = W - 8 - ball.radius;
                ball.vx *= -0.72;
            }

            if (ball.y - ball.radius < 8) {
                ball.y = 8 + ball.radius;
                ball.vy *= -0.72;
            } else if (ball.y + ball.radius > H - 8) {
                ball.y = H - 8 - ball.radius;
                ball.vy *= -0.72;
            }

            // ----- 5. BALL COLLISIONS WITH PLAYERS -----
            handleBallCollision(player, true);
            handleBallCollision(cpu, false);

            // entity separation (player vs cpu)
            const dxEntities = player.x - cpu.x;
            const dyEntities = player.y - cpu.y;
            const distEntities = Math.hypot(dxEntities, dyEntities);
            const minEntityDist = player.radius + cpu.radius;
            if (distEntities < minEntityDist && distEntities > 0.001) {
                const angle = Math.atan2(dyEntities, dxEntities);
                const overlap = minEntityDist - distEntities;
                player.x += Math.cos(angle) * overlap * 0.5;
                player.y += Math.sin(angle) * overlap * 0.5;
                cpu.x -= Math.cos(angle) * overlap * 0.5;
                cpu.y -= Math.sin(angle) * overlap * 0.5;
            }

            // ----- 6. GOAL DETECTION (with cooldown) -----
            if (goalCooldown === 0) {
                // Left goal (CPU scores)
                if (ball.x - ball.radius < leftGoalLineX && ball.y > goalTop && ball.y < goalBottom) {
                    scoreForCpu();
                }
                // Right goal (Player scores)
                else if (ball.x + ball.radius > rightGoalLineX && ball.y > goalTop && ball.y < goalBottom) {
                    scoreForPlayer();
                }
            }
        }

        // ---------- DRAWING (polished graphics) ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // ---- FIELD ----
            // base grass
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(0, 0, W, H);

            // subtle alternating stripes
            ctx.fillStyle = '#3b8f42';
            for (let i = 0; i < W; i += 80) {
                ctx.fillRect(i, 0, 40, H);
            }

            // center circle
            ctx.beginPath();
            ctx.strokeStyle = '#e8e8d0';
            ctx.lineWidth = 3.5;
            ctx.arc(W / 2, H / 2, 70, 0, Math.PI * 2);
            ctx.stroke();

            // halfway line
            ctx.beginPath();
            ctx.moveTo(W / 2, 36);
            ctx.lineTo(W / 2, H - 36);
            ctx.strokeStyle = '#e8e8d0';
            ctx.lineWidth = 3.5;
            ctx.stroke();

            // penalty boxes
            ctx.strokeStyle = '#e8e8d0';
            ctx.lineWidth = 2.8;
            ctx.strokeRect(8, H/2 - 115, 95, 230);
            ctx.strokeRect(W - 103, H/2 - 115, 95, 230);

            // goal areas
            ctx.strokeStyle = '#d6cca8';
            ctx.lineWidth = 2.4;
            ctx.strokeRect(8, H/2 - 60, 48, 120);
            ctx.strokeRect(W - 56, H/2 - 60, 48, 120);

            // ---- GOALS ----
            // Left goal (posts + net)
            ctx.fillStyle = '#c0b28b';
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#fff8e0';
            ctx.fillRect(14, goalTop - 5, 12, 10);
            ctx.fillRect(14, goalBottom - 5, 12, 10);

            // Right goal posts
            ctx.fillRect(W - 26, goalTop - 5, 12, 10);
            ctx.fillRect(W - 26, goalBottom - 5, 12, 10);

            // net lines (decorative)
            ctx.strokeStyle = '#c4b69a';
            ctx.lineWidth = 1.6;
            ctx.shadowBlur = 4;
            for (let y = goalTop; y <= goalBottom; y += 14) {
                ctx.beginPath();
                ctx.moveTo(14, y);
                ctx.lineTo(34, y);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(W - 34, y);
                ctx.lineTo(W - 14, y);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // ---- BALL ----
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#f8f8f8';
            ctx.fill();
            ctx.strokeStyle = '#1e1e1e';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // ball pattern (pentagon-ish)
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius * 0.45, 0, Math.PI * 2);
            ctx.fillStyle = '#1e1e1e';
            ctx.fill();

            // small white highlights
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x - 4, ball.y - 4, 3.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ball.x + 5, ball.y - 3, 2.4, 0, Math.PI * 2);
            ctx.fill();

            // ---- PLAYER (blue) ----
            ctx.shadowBlur = 14;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.strokeStyle = player.border;
            ctx.lineWidth = 4.5;
            ctx.stroke();

            // player eye (aiming direction)
            const angleToMouse = Math.atan2(mouseY - player.y, mouseX - player.x);
            ctx.beginPath();
            ctx.arc(player.x + Math.cos(angleToMouse) * 9, player.y + Math.sin(angleToMouse) * 9, 5.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + Math.cos(angleToMouse) * 11, player.y + Math.sin(angleToMouse) * 11, 2.8, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // ---- CPU (red) ----
            ctx.beginPath();
            ctx.arc(cpu.x, cpu.y, cpu.radius, 0, Math.PI * 2);
            ctx.fillStyle = cpu.color;
            ctx.fill();
            ctx.strokeStyle = cpu.border;
            ctx.lineWidth = 4.5;
            ctx.stroke();

            // cpu eye (looks at ball)
            const angleToBall = Math.atan2(ball.y - cpu.y, ball.x - cpu.x);
            ctx.beginPath();
            ctx.arc(cpu.x + Math.cos(angleToBall) * 9, cpu.y + Math.sin(angleToBall) * 9, 5.5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cpu.x + Math.cos(angleToBall) * 11, cpu.y + Math.sin(angleToBall) * 11, 2.8, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // reset shadow
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            // ---- aim crosshair ----
            ctx.beginPath();
            ctx.strokeStyle = '#fffde7';
            ctx.lineWidth = 2.4;
            ctx.moveTo(mouseX - 12, mouseY);
            ctx.lineTo(mouseX - 5, mouseY);
            ctx.moveTo(mouseX + 5, mouseY);
            ctx.lineTo(mouseX + 12, mouseY);
            ctx.moveTo(mouseX, mouseY - 12);
            ctx.lineTo(mouseX, mouseY - 5);
            ctx.moveTo(mouseX, mouseY + 5);
            ctx.lineTo(mouseX, mouseY + 12);
            ctx.stroke();

            // small dot at center
            ctx.beginPath();
            ctx.fillStyle = '#fff9e0';
            ctx.arc(mouseX, mouseY, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }

        // ---------- GAME LOOP ----------
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- EVENT LISTENERS ----------
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
            if (e.code === 'Space') {
                e.preventDefault();
                if (!keys.space) {
                    keys.space = true;
                    playerKick();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
            if (e.code === 'Space') {
                e.preventDefault();
                keys.space = false;
            }
        });

        // Mouse aiming
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const rawX = (e.clientX - rect.left) * scaleX;
            const rawY = (e.clientY - rect.top) * scaleY;

            mouseX = Math.min(W, Math.max(0, rawX));
            mouseY = Math.min(H, Math.max(0, rawY));
        });

        // prevent context menu
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // reset button
        document.getElementById('resetMatchBtn').addEventListener('click', () => {
            resetMatch();
        });

        // ---------- INIT ----------
        resetPositions('start');
        gameLoop();
    })();
</script>
</body>
</html>
