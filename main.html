<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Soccer Duel · simple 2D game</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1a4d2e 0%, #2e6b42 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 16px;
        }
        .game-wrapper {
            background: #1e3b2a;
            padding: 24px 24px 30px;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.2);
            border-bottom: 6px solid #0f2b1b;
        }
        canvas {
            display: block;
            margin: 0 auto;
            width: 800px;
            height: 500px;
            border-radius: 24px;
            box-shadow: inset 0 0 0 2px #c9b27c, inset 0 0 0 6px #6b4e2e, 0 12px 20px rgba(0, 0, 0, 0.5);
            background-color: #3a7d44;
            cursor: none;
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 12px 0;
            color: #f5e9d8;
            font-weight: 700;
            text-shadow: 2px 2px 0 #0f2b1b, 4px 4px 0 rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }
        .team {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.9rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 22px;
            border-radius: 50px;
            backdrop-filter: blur(2px);
            border: 2px solid #ebd09c;
        }
        .team span {
            font-size: 2rem;
            min-width: 48px;
            text-align: center;
        }
        .divider {
            font-size: 2.4rem;
            opacity: 0.9;
            background: #2d2216;
            padding: 0 18px;
            border-radius: 60px;
            border: 2px solid #bba66b;
            line-height: 1.4;
        }
        .instructions {
            display: flex;
            justify-content: center;
            gap: 40px;
            color: #d9cfb0;
            font-weight: 500;
            font-size: 1.1rem;
            margin-top: 14px;
            text-shadow: 1px 1px 0 #0f2b1b;
            background: #1f3d2b;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #7e9f7a;
        }
        .instructions kbd {
            background: #2e2b20;
            color: #ffeab3;
            padding: 4px 12px;
            border-radius: 30px;
            font-weight: bold;
            border: 1px solid #dbb86a;
            margin: 0 3px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="scoreboard">
        <div class="team">⚽ YOU <span id="playerScore">0</span></div>
        <div class="divider">VS</div>
        <div class="team">CPU <span id="cpuScore">0</span> ⚽</div>
    </div>
    <div class="instructions">
        <div><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move</div>
        <div><kbd>␣ Space</kbd> kick (towards mouse)</div>
    </div>
</div>

<script>
    (function() {
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const playerScoreSpan = document.getElementById('playerScore');
        const cpuScoreSpan = document.getElementById('cpuScore');

        // ---------- FIXED DIMENSIONS ----------
        const W = 800, H = 500;

        // ---------- GAME STATE ----------
        let playerScore = 0;
        let cpuScore = 0;

        // Mouse position (for aiming kicks)
        let mouseX = W / 2;
        let mouseY = H / 2;

        // ---------- BALL ----------
        const ball = {
            x: W / 2,
            y: H / 2,
            vx: 0,
            vy: 0,
            radius: 12,
            friction: 0.985,
            maxSpeed: 11
        };

        // ---------- PLAYER (controlled) ----------
        const player = {
            x: 200,
            y: H / 2,
            radius: 20,
            speed: 4.8,
            color: '#2d7be0',
            border: '#a0d0ff',
            kickPower: 7.5
        };

        // ---------- CPU (opponent) ----------
        const cpu = {
            x: 600,
            y: H / 2,
            radius: 20,
            speed: 3.2,
            color: '#d64545',
            border: '#ffb0b0'
        };

        // ---------- GOALS ----------
        const goalWidth = 130;
        const goalTop = (H - goalWidth) / 2;
        const goalBottom = goalTop + goalWidth;

        // goalposts (for visual and collision)
        const leftGoalLineX = 18;          // ball must cross this to score for CPU (right side? careful)
        const rightGoalLineX = W - 18;

        // ---------- INPUT ----------
        const keys = {
            w: false, a: false, s: false, d: false,
            space: false
        };

        // ---------- RESET POSITIONS (after goal) ----------
        function resetPositions(scoredBy) {
            // Reset ball
            ball.x = W / 2;
            ball.y = H / 2;
            ball.vx = 0;
            ball.vy = 0;

            // Player position
            player.x = 200;
            player.y = H / 2;

            // CPU position
            cpu.x = 600;
            cpu.y = H / 2;

            // small cooldown? not needed but fine
        }

        // ---------- SCORE & RESET ----------
        function scoreForPlayer() {
            playerScore++;
            playerScoreSpan.textContent = playerScore;
            resetPositions('player');
        }

        function scoreForCpu() {
            cpuScore++;
            cpuScoreSpan.textContent = cpuScore;
            resetPositions('cpu');
        }

        // ---------- COLLISION: BALL WITH PLAYER/CPU ----------
        function handleBallCollision(entity, isPlayer = true) {
            const dx = ball.x - entity.x;
            const dy = ball.y - entity.y;
            const dist = Math.hypot(dx, dy);
            const minDist = ball.radius + entity.radius;

            if (dist < minDist && dist > 0.001) {
                // push ball out
                const angle = Math.atan2(dy, dx);
                const overlap = minDist - dist;
                ball.x += Math.cos(angle) * overlap * 1.05;
                ball.y += Math.sin(angle) * overlap * 1.05;

                // reflect velocity with energy
                const speed = Math.hypot(ball.vx, ball.vy);
                if (speed < 0.5 && isPlayer) {
                    // if ball is almost still, give it a tiny nudge in direction of entity's facing (or random)
                    const nudgeAngle = Math.atan2(dy, dx) + (Math.random() - 0.5) * 0.5;
                    const nudgeSpeed = 2.0 + Math.random() * 2;
                    ball.vx += Math.cos(nudgeAngle) * nudgeSpeed;
                    ball.vy += Math.sin(nudgeAngle) * nudgeSpeed;
                } else {
                    // soft bounce – more natural
                    const dot = ball.vx * Math.cos(angle) + ball.vy * Math.sin(angle);
                    // only reflect if moving towards entity
                    if (dot < 0) {
                        ball.vx -= 1.6 * dot * Math.cos(angle);
                        ball.vy -= 1.6 * dot * Math.sin(angle);
                    }
                }

                // add some of player's movement influence (optional)
                if (isPlayer) {
                    // subtle push in direction of movement (wasd)
                    if (keys.w) ball.vy -= 0.4;
                    if (keys.s) ball.vy += 0.4;
                    if (keys.a) ball.vx -= 0.4;
                    if (keys.d) ball.vx += 0.4;
                }

                // limit ball speed after collision
                const newSpeed = Math.hypot(ball.vx, ball.vy);
                if (newSpeed > ball.maxSpeed) {
                    ball.vx = (ball.vx / newSpeed) * ball.maxSpeed;
                    ball.vy = (ball.vy / newSpeed) * ball.maxSpeed;
                }
            }
        }

        // ---------- KICK (player action) ----------
        function playerKick() {
            if (!keys.space) return; // just in case

            const dx = mouseX - player.x;
            const dy = mouseY - player.y;
            const length = Math.hypot(dx, dy);
            if (length < 0.1) return;

            // normalised direction
            const dirX = dx / length;
            const dirY = dy / length;

            // distance between player and ball
            const ballDist = Math.hypot(ball.x - player.x, ball.y - player.y);
            // if ball is close enough (within 70px), kick it
            if (ballDist < 75) {
                // kick power depends on distance to mouse (capped)
                const distToMouse = Math.min(250, Math.hypot(mouseX - player.x, mouseY - player.y));
                const power = 5.0 + (distToMouse / 250) * 6.0; // 5..11

                ball.vx += dirX * power;
                ball.vy += dirY * power;

                // limit ball speed
                const sp = Math.hypot(ball.vx, ball.vy);
                if (sp > 14) {
                    ball.vx = (ball.vx / sp) * 14;
                    ball.vy = (ball.vy / sp) * 14;
                }

                // tiny cooldown (visual feedback - not needed, but kick can be spammed)
                // we'll just rely on spacebar state (keydown triggers one kick)
                // but we want to avoid repeated kicks while holding space → use keydown event with flag
                // handled in event listener
            }
        }

        // ---------- UPDATE GAME (called every frame) ----------
        function update() {
            // ----- 1. PLAYER MOVEMENT (WASD) -----
            let moveX = 0, moveY = 0;
            if (keys.w) moveY -= 1;
            if (keys.s) moveY += 1;
            if (keys.a) moveX -= 1;
            if (keys.d) moveX += 1;

            if (moveX !== 0 || moveY !== 0) {
                const len = Math.hypot(moveX, moveY);
                moveX = (moveX / len) * player.speed;
                moveY = (moveY / len) * player.speed;
            }

            // apply movement with canvas boundaries
            const nextPlayerX = player.x + moveX;
            const nextPlayerY = player.y + moveY;
            // keep player within field (but allow near goals)
            player.x = Math.min(W - player.radius - 8, Math.max(player.radius + 8, nextPlayerX));
            player.y = Math.min(H - player.radius - 8, Math.max(player.radius + 8, nextPlayerY));

            // ----- 2. CPU AI (simple chasing with slight randomness) -----
            // CPU tries to go toward ball, but avoids leaving goal too open
            const cpuTargetX = ball.x;
            const cpuTargetY = ball.y;

            let dxCpu = cpuTargetX - cpu.x;
            let dyCpu = cpuTargetY - cpu.y;
            const distToBall = Math.hypot(dxCpu, dyCpu);

            // AI: move toward ball, but not too aggressively; also react if ball is behind
            if (distToBall > 10) {
                const angle = Math.atan2(dyCpu, dxCpu);
                // add a bit of randomness to make it less perfect
                const randomOffset = (Math.random() - 0.5) * 0.25;
                const moveAngle = angle + randomOffset;
                const step = cpu.speed * (0.9 + Math.random() * 0.2);
                cpu.x += Math.cos(moveAngle) * step;
                cpu.y += Math.sin(moveAngle) * step;
            } else {
                // if very close to ball, small wiggle to avoid stuck
                cpu.x += (Math.random() - 0.5) * 1.0;
                cpu.y += (Math.random() - 0.5) * 1.0;
            }

            // keep CPU within field (but not inside goal areas)
            cpu.x = Math.min(W - cpu.radius - 12, Math.max(cpu.radius + 12, cpu.x));
            cpu.y = Math.min(H - cpu.radius - 12, Math.max(cpu.radius + 12, cpu.y));

            // ----- 3. BALL PHYSICS -----
            ball.x += ball.vx;
            ball.y += ball.vy;

            // friction / air resistance
            ball.vx *= ball.friction;
            ball.vy *= ball.friction;

            // stop tiny movement
            if (Math.abs(ball.vx) < 0.04) ball.vx = 0;
            if (Math.abs(ball.vy) < 0.04) ball.vy = 0;

            // limit max ball speed
            const ballSpeed = Math.hypot(ball.vx, ball.vy);
            if (ballSpeed > 15) {
                ball.vx = (ball.vx / ballSpeed) * 15;
                ball.vy = (ball.vy / ballSpeed) * 15;
            }

            // ----- 4. WALL BOUNCE (top / bottom) -----
            if (ball.x - ball.radius < 8) {
                ball.x = 8 + ball.radius;
                ball.vx *= -0.7;
            } else if (ball.x + ball.radius > W - 8) {
                ball.x = W - 8 - ball.radius;
                ball.vx *= -0.7;
            }

            if (ball.y - ball.radius < 8) {
                ball.y = 8 + ball.radius;
                ball.vy *= -0.7;
            } else if (ball.y + ball.radius > H - 8) {
                ball.y = H - 8 - ball.radius;
                ball.vy *= -0.7;
            }

            // ----- 5. BALL COLLISIONS WITH PLAYERS -----
            handleBallCollision(player, true);
            handleBallCollision(cpu, false);

            // extra: player and cpu shouldn't overlap (simple push apart)
            const dxEntities = player.x - cpu.x;
            const dyEntities = player.y - cpu.y;
            const distEntities = Math.hypot(dxEntities, dyEntities);
            const minEntityDist = player.radius + cpu.radius;
            if (distEntities < minEntityDist && distEntities > 0.001) {
                const angle = Math.atan2(dyEntities, dxEntities);
                const overlap = minEntityDist - distEntities;
                player.x += Math.cos(angle) * overlap * 0.5;
                player.y += Math.sin(angle) * overlap * 0.5;
                cpu.x -= Math.cos(angle) * overlap * 0.5;
                cpu.y -= Math.sin(angle) * overlap * 0.5;
            }

            // ----- 6. GOAL DETECTION (only if ball not too high/low) -----
            // Left goal (CPU scores) → ball crosses left goal line between posts
            if (ball.x - ball.radius < leftGoalLineX && ball.y > goalTop && ball.y < goalBottom) {
                scoreForCpu();
            }
            // Right goal (Player scores) → ball crosses right goal line between posts
            else if (ball.x + ball.radius > rightGoalLineX && ball.y > goalTop && ball.y < goalBottom) {
                scoreForPlayer();
            }

            // ----- 7. KICK (if space was pressed this frame – handled by flag) -----
            // we use 'space' keydown event to call kick directly, so no need here.
        }

        // ---------- DRAWING ----------
        function draw() {
            ctx.clearRect(0, 0, W, H);

            // ---- FIELD ----
            // grass pattern
            ctx.fillStyle = '#2e7d32';
            ctx.fillRect(0, 0, W, H);

            // subtle stripes
            ctx.fillStyle = '#3b8f42';
            for (let i = 0; i < W; i += 60) {
                ctx.fillRect(i, 0, 30, H);
            }

            // center circle & line
            ctx.beginPath();
            ctx.strokeStyle = '#f0f0d0';
            ctx.lineWidth = 3;
            ctx.arc(W / 2, H / 2, 70, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(W / 2, 40);
            ctx.lineTo(W / 2, H - 40);
            ctx.strokeStyle = '#f0f0d0';
            ctx.lineWidth = 3;
            ctx.stroke();

            // penalty areas (simple boxes)
            ctx.strokeStyle = '#f0f0d0';
            ctx.lineWidth = 2.5;
            // left penalty
            ctx.strokeRect(8, H/2 - 110, 90, 220);
            // right penalty
            ctx.strokeRect(W - 98, H/2 - 110, 90, 220);

            // goal areas (small)
            ctx.strokeStyle = '#e0d6b0';
            ctx.lineWidth = 2;
            ctx.strokeRect(8, H/2 - 60, 45, 120);
            ctx.strokeRect(W - 53, H/2 - 60, 45, 120);

            // ---- GOALS (nets) ----
            // Left goal (CPU defends, player scores here?)
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.shadowColor = '#fff8e0';
            ctx.shadowBlur = 10;

            // draw goal posts: left goal line (x = 18)
            ctx.fillStyle = '#c0b28b';
            ctx.shadowBlur = 0;
            // left goal top post
            ctx.fillRect(12, goalTop - 4, 12, 8);
            // left goal bottom post
            ctx.fillRect(12, goalBottom - 4, 12, 8);
            // right goal posts
            ctx.fillRect(W - 24, goalTop - 4, 12, 8);
            ctx.fillRect(W - 24, goalBottom - 4, 12, 8);

            // goal net lines (decorative)
            ctx.strokeStyle = '#d4c6a2';
            ctx.lineWidth = 1.5;
            for (let y = goalTop; y <= goalBottom; y += 12) {
                ctx.beginPath();
                ctx.moveTo(12, y);
                ctx.lineTo(30, y);
                ctx.stroke();
            }
            for (let y = goalTop; y <= goalBottom; y += 12) {
                ctx.beginPath();
                ctx.moveTo(W - 30, y);
                ctx.lineTo(W - 12, y);
                ctx.stroke();
            }

            // shadows off
            ctx.shadowBlur = 0;

            // ---- BALL ----
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            // soccer ball pattern
            ctx.fillStyle = '#f0f0f0';
            ctx.fill();
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // ball details (pentagons / lines)
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = '#2a2a2a';
            ctx.fill();

            // small dots for style
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x - 4, ball.y - 4, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(ball.x + 4, ball.y - 3, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // ---- PLAYER (blue) ----
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.fill();
            ctx.strokeStyle = player.border;
            ctx.lineWidth = 4;
            ctx.stroke();

            // player eye direction (towards mouse)
            const angleToMouse = Math.atan2(mouseY - player.y, mouseX - player.x);
            ctx.beginPath();
            ctx.arc(player.x + Math.cos(angleToMouse) * 8, player.y + Math.sin(angleToMouse) * 8, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(player.x + Math.cos(angleToMouse) * 10, player.y + Math.sin(angleToMouse) * 10, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // ---- CPU (red) ----
            ctx.beginPath();
            ctx.arc(cpu.x, cpu.y, cpu.radius, 0, Math.PI * 2);
            ctx.fillStyle = cpu.color;
            ctx.fill();
            ctx.strokeStyle = cpu.border;
            ctx.lineWidth = 4;
            ctx.stroke();

            // cpu eye (looks at ball)
            const angleToBall = Math.atan2(ball.y - cpu.y, ball.x - cpu.x);
            ctx.beginPath();
            ctx.arc(cpu.x + Math.cos(angleToBall) * 8, cpu.y + Math.sin(angleToBall) * 8, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cpu.x + Math.cos(angleToBall) * 10, cpu.y + Math.sin(angleToBall) * 10, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            // reset shadow
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';

            // ---- aim indicator (small crosshair at mouse) ----
            ctx.beginPath();
            ctx.strokeStyle = '#fff9e0';
            ctx.lineWidth = 2;
            ctx.moveTo(mouseX - 10, mouseY);
            ctx.lineTo(mouseX - 4, mouseY);
            ctx.moveTo(mouseX + 4, mouseY);
            ctx.lineTo(mouseX + 10, mouseY);
            ctx.moveTo(mouseX, mouseY - 10);
            ctx.lineTo(mouseX, mouseY - 4);
            ctx.moveTo(mouseX, mouseY + 4);
            ctx.lineTo(mouseX, mouseY + 10);
            ctx.stroke();
        }

        // ---------- GAME LOOP ----------
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ---------- EVENT LISTENERS ----------
        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = true;
                e.preventDefault();
            }
            if (e.code === 'Space') {
                e.preventDefault(); // prevent page scroll
                // perform kick only if not already pressed (avoid autofire)
                if (!keys.space) {
                    keys.space = true;
                    playerKick();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'w' || key === 'a' || key === 's' || key === 'd') {
                keys[key] = false;
                e.preventDefault();
            }
            if (e.code === 'Space') {
                e.preventDefault();
                keys.space = false;
            }
        });

        // Mouse move for aiming
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            const rawX = (e.clientX - rect.left) * scaleX;
            const rawY = (e.clientY - rect.top) * scaleY;

            // clamp to canvas area, just in case
            mouseX = Math.min(W, Math.max(0, rawX));
            mouseY = Math.min(H, Math.max(0, rawY));
        });

        // Prevent context menu on canvas (right click)
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Also allow kick via click? not needed, but could be handy.
        // We'll stick to spacebar as described.

        // ensure mouse leaves canvas gracefully – but keep last position

        // ---------- RESET / INIT ----------
        // Initial reset to center everything nicely
        resetPositions('start');

        // start the loop
        gameLoop();
    })();
</script>
</body>
</html>
